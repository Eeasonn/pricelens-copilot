# PriceLens Copilot 在线发布：push main 即自动构建并部署到 GitHub Pages（独立链接）。
# 产物 = pricelens/dist（自包含单文件，无外部资源引用，任意 base path 可用）。
# 在线静态托管没有 agent-server：构建前移除 .env.production，
# 使 Agent 走本地确定性适配器（数值本就全部由本地引擎计算，页面完整可用）。
# 真实方舟模式仍按 README 本地运行 agent-server。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pricelens/package-lock.json
      - name: Install dependencies
        working-directory: pricelens
        run: npm ci
      - name: Typecheck
        working-directory: pricelens
        run: npm run typecheck
      - name: Tests
        working-directory: pricelens
        run: npm run test -- --run
      - name: Build (静态托管模式：无 agent-server，走本地确定性适配器)
        working-directory: pricelens
        run: |
          rm .env.production
          npm run build
      - name: Verify data and build artifacts
        working-directory: pricelens
        run: npm run verify
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pricelens/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
